<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio 2 de HTML</title>
  </head>
  <body>
    <h1>Rellena los datos:</h1>
    <form style="display: flex; flex-direction: column; gap: 1rem;" action="http://www.youtube.com">
      <label
        >Name
        <input type="text" required name="name" aria-label="name" tabindex="1" autofocus/>
      </label>
      <label
        >Last name
        <input type="text" required name="lastName" aria-label="lastName" tabindex="2"/>
      </label>
      <label
        >Age
        <input type="number" required name="age" min="1" max="120" aria-label="age" tabindex="3"/>
      </label>
      <label
        >Email
        <input type="email" required name="email" aria-label="email" tabindex="4"/>
      </label>
      <label
        >Agree to the terms?
        <input type="radio" required name="termsRadio" aria-label="termsRadio" tabindex="5"/>
      </label>
      <label
        >Agree to the terms?
        <input type="checkbox" required name="termsCheckbox" aria-label="termsCheckbox" tabindex="6"/>
      </label>

      <input type="submit" required value="Submit" aria-label="submit" tabindex="7"/>
    </form>
  </body>
</html>
